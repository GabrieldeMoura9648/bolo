name: CI/CD Docker Pipeline
 
on:
  push:
    branches: [ master ]
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: GabrieldeMoura9648/bolo:latest
 
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
 
    steps:
      - name: Implantar na VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            docker pull GabrieldeMoura9648/bolo:latest
            docker rm -f bolo app-docker-aula || true
            docker run -d --name bolo -p 89:80 --restart unless-stopped GabrieldeMoura9648/bolo:latest
 
 